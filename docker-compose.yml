services:
  postgres:
    image: postgres:16-alpine
    container_name: frog1-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: frog
      POSTGRES_PASSWORD: frog
      POSTGRES_DB: frog1
    volumes:
      - frog1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frog -d frog1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frog1_postgres_data:
